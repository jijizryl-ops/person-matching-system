<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Person Matching System — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);overflow:hidden}
    .login-wrap{display:flex;width:900px;max-width:96vw;min-height:520px;border-radius:24px;overflow:hidden;box-shadow:0 32px 80px rgba(0,0,0,0.18)}
    .login-left{flex:1.1;background:linear-gradient(145deg,var(--green-dark) 0%,var(--green) 60%,var(--green-light) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 36px;position:relative;overflow:hidden}
    .login-left::before{content:'';position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,0.06);top:-80px;left:-80px}
    .login-left::after{content:'';position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,0.05);bottom:-40px;right:-40px}
    .login-left .seal{width:90px;height:90px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:20px;border:2px solid rgba(255,255,255,0.3);font-size:40px}
    .login-left h1{font-family:'Playfair Display',serif;color:#fff;font-size:26px;text-align:center;margin:0 0 8px;line-height:1.3}
    .login-left p{color:rgba(255,255,255,0.75);text-align:center;font-size:13px;line-height:1.7;margin:0}
    .login-right{flex:1;background:#fff;display:flex;flex-direction:column;justify-content:center;padding:52px 44px}
    .login-right h2{font-family:'Outfit',sans-serif;font-weight:700;font-size:26px;color:var(--green-dark);margin:0 0 6px}
    .login-right .sub{color:#888;font-size:13px;margin:0 0 32px}
    .form-group{margin-bottom:20px}
    .form-group label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
    .form-group input{width:100%;padding:12px 16px;border:1.5px solid #e0e0e0;border-radius:10px;font-family:'Outfit',sans-serif;font-size:14px;color:#222;outline:none;transition:border .2s;box-sizing:border-box}
    .form-group input:focus{border-color:var(--green)}
    .btn-login{width:100%;padding:13px;background:linear-gradient(135deg,var(--green-dark),var(--green));color:#fff;border:none;border-radius:10px;font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s,transform .1s}
    .btn-login:hover{opacity:.92;transform:translateY(-1px)}
    .error-msg{background:#fff0f0;border:1px solid #ffcccc;color:#c0392b;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none}
    .loading{display:none;text-align:center;color:var(--green);font-size:13px;margin-top:12px}
    @media(max-width:640px){.login-left{display:none}.login-right{padding:36px 24px}}
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-left">
    <div class="seal">🏛️</div>
    <h1>Person Matching System</h1>
    <p>Barangay Resident Management<br/>& Person Matching Portal</p>
  </div>
  <div class="login-right">
    <h2>Welcome back</h2>
    <p class="sub">Sign in to your account to continue</p>
    <div class="error-msg" id="errorMsg">Invalid username or password.</div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter your username" autocomplete="username"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password"/>
    </div>
    <button class="btn-login" onclick="doLogin()">Sign In</button>
    <div class="loading" id="loading">⏳ Checking credentials...</div>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/sheets.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
